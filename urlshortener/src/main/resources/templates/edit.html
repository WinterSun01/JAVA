<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать ссылку</title>
    <style>
        body
        {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('/images/sunrise.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #333;
        }
        .container
        {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        h1
        {
            color: #1a3c5e;
        }
        form
        {
            margin: 25px 0;
        }
        label
        {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        input[type="text"]
        {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button
        {
            padding: 12px 24px;
            background: #1a3c5e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover
        {
            background: #2c5a8a;
        }
        .error { color: #e74c3c; margin-top: 6px; }
        a
        {
            display: inline-block;
            margin-top: 20px;
            color: #2980b9;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>Редактировать ссылку</h1>

    <form th:action="@{/update}" th:object="${urlLink}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label>Оригинальная ссылка:</label>
        <input type="text" th:field="*{originalUrl}" />
        <p th:if="${#fields.hasErrors('originalUrl')}" class="error" th:errors="*{originalUrl}"></p>

        <br><button type="submit">Сохранить изменения</button>
    </form>

    <a href="/">Вернуться к списку</a>
</div>
</body>
</html>
